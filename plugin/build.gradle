apply plugin: 'groovy'
apply plugin: 'java'

group = 'org.intermine'
// the release number is set once, in gradle/libs.versions.toml, as for the other builds
version = libs.versions.intermine.get()

// Java 8 bytecode whatever the build JDK; --release 8 on JDK 9+
apply from: "${rootDir}/../config/gradle/java-target.gradle"

repositories {
    maven {
        url = project.getProperty("intermine.maven.central")
    }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

// Tests (src/test/groovy): Gradle TestKit builds of small synthetic mines in build/testkit/mines, which apply the plugin
// of this build (see docs/BUILDING.md, "Tests of the plugin"). The mines resolve only from a file Maven repository that
// each test writes, so the tests need no network and no InterMine artifact.
sourceSets {
    // Stand-ins for the InterMine Ant tasks that the tests run (SOToModelTask, ModelMergerTask, ModelOutputTask,
    // PostProcessorTask and the pre-retrieve and loader tasks of fake bio sources), with the genomic model and keys of the fake
    // bio-model, packed into the fake bio-model and intermine-integrate jars of the tests
    testKitTasks
}

configurations {
    // the log4j 1 API that the Ant tasks of a mine log through, put on the runtime classpath of the test mines
    testKitReload4j {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation libs.junit
    testKitTasksCompileOnly libs.ant
    testKitTasksCompileOnly libs.reload4j
    testKitReload4j libs.reload4j
}

def testKitTasksJar = tasks.register('testKitTasksJar', Jar) {
    description = 'Packs the stand-in Ant tasks of the TestKit tests'
    archiveFileName = 'testkit-tasks.jar'
    destinationDirectory = layout.buildDirectory.dir('testkit/jars')
    from sourceSets.testKitTasks.output
}

// What the java-gradle-plugin plugin would add for GradleRunner.withPluginClasspath(): a
// plugin-under-test-metadata.properties with the plugin's classes on the test runtime classpath. That plugin is not
// applied because it also adds a publication and plugin markers, which would change what this build publishes.
def pluginUnderTestMetadata = tasks.register('pluginUnderTestMetadata', PluginUnderTestMetadata) {
    outputDirectory = layout.buildDirectory.dir('pluginUnderTestMetadata')
    pluginClasspath.from(sourceSets.main.output)
}
dependencies {
    testRuntimeOnly files(pluginUnderTestMetadata)
}

tasks.named('test', Test) {
    inputs.files(testKitTasksJar).withPropertyName('testKitTasksJar')
    // this plugin's own jar, which a mine's mergeModels puts on the Ant class path (MergeSourceModelsTask)
    inputs.files(tasks.named('jar')).withPropertyName('pluginJar')
    inputs.files(configurations.testKitReload4j).withPropertyName('testKitReload4j')
    def testKitDir = layout.buildDirectory.dir('testkit').get().asFile
    def tasksJar = testKitTasksJar.flatMap { it.archiveFile }
    def reload4j = configurations.testKitReload4j
    def pluginJar = tasks.named('jar').flatMap { it.archiveFile }
    jvmArgumentProviders.add({
        ["-Dtestkit.dir=${testKitDir}", "-Dtestkit.tasksJar=${tasksJar.get().asFile}",
         "-Dtestkit.reload4jJar=${reload4j.singleFile}", "-Dtestkit.pluginJar=${pluginJar.get().asFile}"]
    } as CommandLineArgumentProvider)
    testLogging {
        exceptionFormat = 'full'
    }
}

// Publishing (maven-publish, signing, sources and javadoc jars, `install` alias, Central bundle): see docs/RELEASING.md
ext.imPublicationDescription = 'InterMine Plugin'
apply from: "${rootDir}/../config/gradle/publishing.gradle"
apply from: "${rootDir}/../config/gradle/central-bundle.gradle"

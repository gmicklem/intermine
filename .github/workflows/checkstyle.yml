---
# yamllint disable rule:line-length
# When this workflow runs, and why (dependency maintenance, bead im-8dd.10):
#   - pull_request (any branch): gates every pull request, in particular Renovate's dependency
#     bumps (renovate/* branches), so a bump is merged or automerged only when the style and @throws checks are green.
#   - push to maint-2026, maint/** and release/**: a result for every merge into those branches.
#   - schedule: weekly, Monday 05:00 UTC, just before Renovate's "before 6am on Monday" window
#     (UK time), so the branch heads Renovate bumps have a fresh result.
#   - workflow_dispatch: by hand, `gh workflow run checkstyle.yml --ref <branch>`.
# paths-ignore: a change that touches only documentation or bot configuration does not start the run.
# Push and pull_request use the same list, written out twice (no YAML anchors). The earlier push trigger
# (a path allow-list, "paths:", and no branch list) never started a run on this fork, although dozens
# of pushes to maint-2026 and release/* changed matching files; the sibling forks that trigger on push
# without a path filter do run. No secrets are used, so a run from a Renovate branch of this
# repository needs nothing the push run does not.
name: Checkstyle
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - maint-2026
      - 'maint/**'
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'renovate.json'
      - '.github/renovate.json*'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'renovate.json'
      - '.github/renovate.json*'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request (or per ref), as the registry's ci.yml does.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkstyle:
    name: checkstyle (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # checkstyle 9.3 runs on JDK 8 and later and gives the same result on any of them; use the build JDK
        java: [17]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache Gradle dependencies and wrapper distributions
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-checkstyle-${{ hashFiles('**/*.gradle', '**/gradle.properties.in', '**/gradle-wrapper.properties.in', 'config/lib/install_intermine.py') }}
          restore-keys: |
            gradle-${{ runner.os }}-checkstyle-
            gradle-${{ runner.os }}-
      - name: Check style and @throws tags
        run: |
          set -euxo pipefail
          ./config/ci/init.sh ${GITHUB_WORKSPACE} $(which python3) checkstyle none none
          ./config/ci/run.sh ${GITHUB_WORKSPACE} $(which python3) checkstyle none none
      - name: Upload checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-reports-java${{ matrix.java }}
          path: |
            **/build/reports/checkstyle/*.xml
            **/build/reports/doclint-throws/*.txt
          if-no-files-found: ignore
          retention-days: 14

# ci-trigger-test: temporary line to exercise the pull_request trigger (to be reverted)

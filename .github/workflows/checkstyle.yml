---
# yamllint disable rule:line-length
name: Checkstyle
# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - .github/workflows/checkstyle.yml
      - 'bio/**'
      - 'config/**'
      - 'docs/**'
      - 'gradle/**'
      - 'intermine/**'
      - 'plugin/**'
      - 'testmine/**'
  pull_request:
    paths:
      - .github/workflows/checkstyle.yml
      - 'bio/**'
      - 'config/**'
      - 'docs/**'
      - 'gradle/**'
      - 'intermine/**'
      - 'plugin/**'
      - 'testmine/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

jobs:
  checkstyle:
    name: checkstyle (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # checkstyle 7.8.1 gives the same result on any JDK; use the build JDK
        java: [17]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache Gradle dependencies and wrapper distributions
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-checkstyle-${{ hashFiles('**/*.gradle', '**/gradle.properties.in', '**/gradle-wrapper.properties.in', 'config/lib/install_intermine.py') }}
          restore-keys: |
            gradle-${{ runner.os }}-checkstyle-
            gradle-${{ runner.os }}-
      - name: Check style
        run: |
          set -euxo pipefail
          ./config/ci/init.sh ${GITHUB_WORKSPACE} $(which python3) checkstyle none none
          ./config/ci/run.sh ${GITHUB_WORKSPACE} $(which python3) checkstyle none none
      - name: Upload checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-reports-java${{ matrix.java }}
          path: '**/build/reports/checkstyle/*.xml'
          if-no-files-found: ignore
          retention-days: 14

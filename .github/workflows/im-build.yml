---
# yamllint disable rule:line-length
name: InterMine CI
# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - .github/workflows/im-build.yml
      - 'bio/**'
      - 'config/**'
      - 'docs/**'
      - 'gradle/**'
      - 'intermine/**'
      - 'plugin/**'
      - 'testmine/**'
  pull_request:
    paths:
      - .github/workflows/im-build.yml
      - 'bio/**'
      - 'config/**'
      - 'docs/**'
      - 'gradle/**'
      - 'intermine/**'
      - 'plugin/**'
      - 'testmine/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run
# pointless. Never cancel runs on dev or master, so every merge keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

env:
  SOLR_VERSION: 8.6.2

jobs:
  unit-tests:
    name: unit tests (${{ matrix.testSuite }}, Java ${{ matrix.java }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Label used to access the service container
      postgres:
        image: postgres:${{ matrix.postgres }}
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTMODEL_PATH: intermine-demo
    strategy:
      # Let every combination finish so one flaky cell does not hide the rest.
      fail-fast: false
      matrix:
        testSuite: [intermine, bio]
        # The builds and tests run on JDK 17; the jars stay Java 8 bytecode
        # (config/gradle/java-target.gradle), so 6.x still runs on a JDK 8
        # Tomcat. The JDK 8 cells show that a JDK 8-only machine still builds
        # and passes, until 6.0.0 is out. JDK 21 also passes the full gate
        # (checked by hand); it is left out to keep the matrix at 4 cells.
        java: [8, 17]
        postgres: ['14', '16']
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The wrapper properties are generated by config/lib/install_intermine.py
      # (so setup-gradle cannot be keyed on them); key on the build scripts instead.
      - name: Cache Gradle dependencies and wrapper distributions
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.testSuite }}-${{ hashFiles('**/*.gradle', '**/gradle.properties.in', '**/gradle-wrapper.properties.in', 'config/lib/install_intermine.py') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.testSuite }}-
            gradle-${{ runner.os }}-
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libpq-dev postgresql-client
      # Fail in seconds, with a clear message, if the service container is not
      # reachable with the credentials config/ci/init.sh uses (no sudo, no prompt).
      - name: Check PostgreSQL connection
        env:
          PGPASSWORD: postgres
        run: psql -w -h localhost -U postgres -c 'select version()'
      - name: Run unit tests
        run: |
          set -euo pipefail
          ./config/ci/init.sh ${GITHUB_WORKSPACE} $(which python3) ${{ matrix.testSuite }} none none
          ./config/ci/run.sh ${GITHUB_WORKSPACE} $(which python3) ${{ matrix.testSuite }} none none
      - name: Summarise test results
        if: always()
        run: python3 config/ci/junit-summary.py "${GITHUB_WORKSPACE}" "Unit tests (${{ matrix.testSuite }}, Java ${{ matrix.java }}, PostgreSQL ${{ matrix.postgres }})" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-xml-${{ matrix.testSuite }}-java${{ matrix.java }}-pg${{ matrix.postgres }}
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload HTML test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: html-reports-${{ matrix.testSuite }}-java${{ matrix.java }}-pg${{ matrix.postgres }}
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
          retention-days: 14

  ws-tests:
    name: web service tests (${{ matrix.client }} client)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Label used to access the service container
      postgres:
        image: postgres:14
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTMODEL_PATH: intermine-demo
    strategy:
      fail-fast: false
      matrix:
        client: [JS, PY]
        # the web application on the build JDK of 6.0.0 (testmine runs on 8 too)
        java: [17]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Python 3.12 no longer ships setuptools/distutils, which the
      # intermine-ws-python setup.py (python setup.py test) imports.
      - name: Install Python build tools
        run: python3 -m pip install --upgrade pip setuptools wheel
      - name: Set up Node.js
        if: matrix.client == 'JS'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # config/run-ws-tests.sh calls `grunt test` from PATH; imjs only lists
      # grunt-cli as a devDependency.
      - name: Install grunt
        if: matrix.client == 'JS'
        run: npm install --global grunt-cli
      - name: Cache Gradle dependencies and wrapper distributions
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-ws-${{ hashFiles('**/*.gradle', '**/gradle.properties.in', '**/gradle-wrapper.properties.in', 'config/lib/install_intermine.py') }}
          restore-keys: |
            gradle-${{ runner.os }}-ws-
            gradle-${{ runner.os }}-
      - name: Install Ubuntu packages
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libpq-dev postgresql-client wait-for-it
      # Fail in seconds, with a clear message, if the service container is not
      # reachable with the credentials config/ci/init.sh uses (no sudo, no prompt).
      - name: Check PostgreSQL connection
        env:
          PGPASSWORD: postgres
        run: psql -w -h localhost -U postgres -c 'select version()'
      # Official Solr image instead of unpacking the tarball from
      # archive.apache.org (the idea from the speed-up-solr-in-workflow branch,
      # without its third-party action).
      - name: Start Solr
        run: ./config/ci/init-solr-docker.sh "${SOLR_VERSION}"
      - name: Run webservices tests
        run: |
          set -euo pipefail
          ./config/ci/init.sh ${GITHUB_WORKSPACE} $(which python3) ws ${{ matrix.client }} http://localhost:8080/intermine-demo
          ./config/ci/run.sh ${GITHUB_WORKSPACE} $(which python3) ws ${{ matrix.client }} http://localhost:8080/intermine-demo
      - name: Show Solr log
        if: failure()
        run: docker logs im-solr || true
      - name: Upload web application logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ws-logs-${{ matrix.client }}-java${{ matrix.java }}
          path: |
            testmine/**/build/**/*.log
            testmine/**/build/**/logs/**
          if-no-files-found: ignore
          retention-days: 14

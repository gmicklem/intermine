apply plugin: "war"

buildscript {
    repositories {
        maven {
            url = project.getProperty("intermine.maven.central")
        }
        maven {
            url = project.getProperty("intermine.maven.plugins")
        }
    }

    dependencies {
        classpath 'com.bmuschko:gradle-cargo-plugin:2.9.0'
    }
}
apply plugin: "com.bmuschko.cargo"

def explodedWebAppDir = layout.buildDirectory.dir("explodedWebApp").get().asFile
def mergePropsDir = layout.buildDirectory.dir("props").get().asFile

ext {
    minePropertyFileName = "testmodel.properties"
    minePropertyFile = "${System.env.HOME}/.intermine/$minePropertyFileName"
    println "Using properties file: '$minePropertyFile' "
}


configurations {
    imWebApp
    tomcat
}

dependencies {
    implementation project(":dbmodel")
    // The generated testmodel classes (Employee, Bank, ...) that webapp's sources use. At run time they are
    // in the dbmodel jar (dbmodel's copyTestModel puts them into its resources). A java-library project
    // dependency compiles against dbmodel's classes directory, which does not contain them, so they are
    // taken from here; compileOnly keeps this jar out of the war.
    compileOnly group: "org.intermine", name: "intermine-testresources", version: imVersion, transitive: false
    implementation group: "org.intermine", name: "intermine-webapp", version: imVersion, classifier: "classes"
    implementation group: "org.intermine", name: "intermine-api", version: imVersion
    implementation group: "org.intermine", name: "intermine-webtasks", version: imVersion
    // Struts, DWR, JSTL and JavaMail are in WEB-INF/lib of the intermine-webapp war that unwarIMWebApp explodes into
    // the final war, with the versions of its pom. This build resolves intermine-webapp from a local directory without
    // the pom, so as implementation these libraries came with Struts' own old commons-beanutils 1.8.0,
    // commons-digester 1.8 and commons-validator 1.3.1 next to the 1.9.4, 2.1 and 1.9.0 of intermine-webapp.
    // compileOnly: the classes compile against them and the war carries the one set.
    compileOnly libs.jstl
    compileOnly libs.struts.core
    compileOnly libs.struts.taglib
    compileOnly libs.struts.extras
    compileOnly libs.struts.tiles
    compileOnly libs.javax.mail
    compileOnly libs.dwr
    runtimeOnly libs.jsp.api
    runtimeOnly libs.taglibs.string
    runtimeOnly libs.commons.fileupload
    runtimeOnly libs.json
    imWebApp group: "org.intermine", name: "intermine-webapp", version: imVersion, transitive: false, ext: "war"
    providedCompile libs.javax.servlet.api
    // the catalog supplies group, name and version; a catalog entry cannot carry the artifact type, so the "@zip" is spelled out
    tomcat(libs.tomcat) {
        artifact {
            name = 'tomcat'
            type = 'zip'
            extension = 'zip'
        }
    }
}

processResources {
    exclude "default-template-queries.xml"
    exclude "main/"
}

war {
    dependsOn 'mergeProperties', 'summariseTestObjectStore', 'unwarIMWebApp'
    finalizedBy 'warTestModelWebApp'
}

// intermine.properties is this project's own copy (processResources, see the root build file); until 2026-11 a
// copyModelProperties task copied dbmodel's copy of the same file into the resources output, with no dependency on
// the task that wrote it.
def intermineProperties = new File(sourceSets.main.output.resourcesDir, "intermine.properties")
task mergeProperties(type: Copy) {
    description = "Appends intermine.properties to web.properties file"
    inputs.files(tasks.named('processResources'))
    from war.webAppDirectory.file("WEB-INF/web.properties")
    into mergePropsDir
    doLast {
        new File(mergePropsDir, "web.properties").append(intermineProperties.getText())
    }
}

// this task requires a database to exist and be populated. However this task is run at compile time, not runtime.
// We have no guarantee there will be a database. Hence the try/catch
task summariseTestObjectStore {
    description = "Summarise Test model ObjectStore into objectstoresummary.properties file"
    // the Ant task reads default.intermine.properties from build/resources/main
    inputs.files(tasks.named('processResources'))

    doLast {
        try {
            ant.taskdef(name: "summarizeObjectStoreTask", classname: "org.intermine.task.SummariseObjectStoreTask") {
                classpath {
                    dirset(dir: layout.buildDirectory.get().asFile)
                    pathelement(path: configurations.runtimeClasspath.asPath)
                }
            }
            ant.summarizeObjectStoreTask(alias: "os.unittest", configFileName: "objectstoresummary.config.properties", outputFile: "build/props/objectstoresummary.properties")
        } catch (Exception e) {
            println "ERROR" + e
        }
    }
}


task unwarIMWebApp(type: Copy) {
    description = "Unwar intermine-webapp under the build/explodedWebAppDir directory"
    from { zipTree(configurations.imWebApp.singleFile) }
    destinationDir = new File("$explodedWebAppDir")
}

task warTestModelWebApp(type: War) {
    description = "Create the war from the build/explodedWebAppDir directory"
    from "${explodedWebAppDir}"
    exclude "WEB-INF/web.properties"
    // intermine-webapp's WEB-INF/lib (exploded above) and this project's own libraries share some jars
    // (same name and version); keep one entry of each instead of two entries with the same name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    webInf { from "${mergePropsDir}" }
}

cargo {
    // change this to match your Tomcat major version (keep the x)
    containerId = 'tomcat9x'

    def props = new Properties()
    file(minePropertyFile).withInputStream { props.load(it) }

    // change this to the Tomcat root of your choice
    deployable {
        context = props.getProperty("webapp.path")
    }

    local {
        installer {
            installConfiguration = configurations.tomcat
            downloadDir = layout.buildDirectory.dir("downloads").get().asFile
            extractDir = layout.buildDirectory.dir("extracts").get().asFile
        }
        // Cargo starts Tomcat without catalina.sh, so on JDK 9+ it also needs the java.lang opening that catalina.sh adds
        // (cglib, see config/gradle/java-target.gradle)
        jvmArgs = '-Dorg.apache.el.parser.SKIP_IDENTIFIER_CHECK=true' +
                (JavaVersion.current().isJava9Compatible() ? ' --add-opens=java.base/java.lang=ALL-UNNAMED' : '')
    }
}

// lifecycle: cargo deploys build/libs/webapp.war, and the last task to write that file is warTestModelWebApp, the
// finalizer of war (so it runs after war). Gradle 8 fails a task that reads another task's output without depending on it.
['cargoRunLocal', 'cargoStartLocal'].each { name ->
    tasks.named(name) { dependsOn 'war', 'warTestModelWebApp' }
}

ext {
    taskGroup = "InterMine"
    minePropertyFileName = "testmodel.properties"
    minePropertyFile = "${System.env.HOME}/.intermine/$minePropertyFileName"
    println "Using properties file: '$minePropertyFile' "
}

subprojects {
    apply plugin: 'java-library'

    // Java 8 bytecode whatever the build JDK; --release 8 on JDK 9+
    apply from: "${rootDir}/../config/gradle/java-target.gradle"

    // -------------------------
    // Build localDirs list
    // -------------------------

    def intermineLocalDirs = []
    def intermineRootDir = project.getProperty("intermine.development.intermineRootDir")
    def intermineModules = project.getProperty("intermine.development.intermineModules")

    if (intermineRootDir && intermineModules) {
        def modules = intermineModules.split(',').collect { it.trim() }.findAll { it }
        intermineLocalDirs = modules.collect {
            module -> "${intermineRootDir}/${module}/build/libs"
        }
    }

    def localDirs = intermineLocalDirs

    repositories {
        // Prefer locally-built InterMine artifacts
        localDirs.each { dir ->
            ivy {
                url = "file://" + dir
                patternLayout {
                    artifact  "[artifact]-[revision](-[classifier]).[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }
        maven {
            url = project.getProperty("intermine.maven.central")
        }
        maven {
            url = project.getProperty("intermine.maven.ebi")
        }
        maven {
            url = project.getProperty("intermine.maven.clojars")
        }
    }

    configurations {
        commonResources
    }

    dependencies {
        // api, not implementation: webapp compiles against dbmodel and has always seen these through it
        api libs.ant
        api libs.reload4j
        api libs.slf4j.reload4j
        commonResources libs.intermine.resources
    }

    // Both property files reach build/resources/main through processResources, so every task that reads that
    // directory (jar, war, the Ant tasks below) depends on them through its inputs (an error in Gradle 8 otherwise).
    task copyMineProperties(type: Copy) {
        description = "Copies mine specific intermine.properties file (from .intermine directory) into resources output to be included in the war"
        from minePropertyFile
        into layout.buildDirectory.dir('im/mine-properties')
        rename { fileName -> fileName.replace("testmodel.properties", "intermine.properties") }
        // A missing minePropertyFile leaves the Copy without sources, so Gradle skips it as
        // NO-SOURCE; stopExecutionIfEmpty() was removed in Gradle 5.0.
    }

    task copyDefaultProperties(type: Copy) {
        description = "Copies default.intermine.properties file (from resources project) into resources output to be included in the war"
        from({ zipTree(configurations.commonResources.singleFile) }) {
            include "default.intermine.test.properties"
        }
        into layout.buildDirectory.dir('im/default-properties')
        rename { fileName -> fileName.replace("default.intermine.test.properties", "default.intermine.properties") }
    }

    processResources {
        from copyMineProperties
        from copyDefaultProperties
    }

    // The Ant tasks below run InterMine code with the log4j 1 API (reload4j) in a class loader of their own, and nothing on
    // their class path configures it (intermine-resources has no log4j.properties), so every logger printed "log4j:WARN
    // No appenders could be found" and the messages were lost. As the plugin does for a mine (DBModelUtils.antLoggingDir,
    // which this build does not use): a console appender, from a directory of its own that goes on the class path of each
    // taskdef. org.intermine.sql is WARN: with the appender buildDB's "Dropping table" lines would be shown, one per table.
    // log4j.ignoreTCL makes reload4j load the classes of the configuration from its own class loader: Gradle's, which is the
    // thread context class loader of the Ant task, has the log4j-over-slf4j classes (Appender, ConsoleAppender,
    // PatternLayout) and the appender would be dropped as "not assignable to a Appender variable".
    ext.antLoggingDir = {
        System.setProperty('log4j.ignoreTCL', 'true')
        File dir = layout.buildDirectory.dir('im/antLogging').get().asFile
        File config = new File(dir, 'log4j.properties')
        String text = '''# written by testmine/build.gradle for the Ant tasks
log4j.rootLogger=INFO, console
log4j.logger.org.intermine.sql=WARN
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n
'''
        if (!config.exists() || config.text != text) {
            dir.mkdirs()
            config.text = text
        }
        dir
    }
}

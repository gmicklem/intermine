ext {
    imVersion = libs.versions.intermine.get()
    taskGroup = "InterMine"
    minePropertyFileName = "testmodel.properties"
    minePropertyFile = "${System.env.HOME}/.intermine/$minePropertyFileName"
    println "Using properties file: '$minePropertyFile' "
}

subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    // -------------------------
    // Build localDirs list
    // -------------------------

    def intermineLocalDirs = []
    def intermineRootDir = project.getProperty("intermine.development.intermineRootDir")
    def intermineModules = project.getProperty("intermine.development.intermineModules")

    if (intermineRootDir && intermineModules) {
        def modules = intermineModules.split(',').collect { it.trim() }.findAll { it }
        intermineLocalDirs = modules.collect {
            module -> "${intermineRootDir}/${module}/build/libs"
        }
    }

    def localDirs = intermineLocalDirs

    repositories {
        // Prefer locally-built InterMine artifacts
        localDirs.each { dir ->
            ivy {
                url = "file://" + dir
                patternLayout {
                    artifact  "[artifact]-[revision](-[classifier]).[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }
        maven {
            url = project.getProperty("intermine.maven.central")
        }
        maven {
            url = project.getProperty("intermine.maven.ebi")
        }
        maven {
            url = project.getProperty("intermine.maven.clojars")
        }
    }

    configurations {
        commonResources
    }

    dependencies {
        // api, not implementation: webapp compiles against dbmodel and has always seen these through it
        api libs.ant
        api libs.reload4j
        api libs.slf4j.reload4j
        commonResources group: "org.intermine", name: "intermine-resources", version: imVersion
    }

    task copyMineProperties(type: Copy) {
        description = "Copies mine specific intermine.properties file (from .intermine directory) into resources output to be included in the war"
        from minePropertyFile
        into sourceSets.main.output.resourcesDir
        rename { fileName -> fileName.replace("testmodel.properties", "intermine.properties") }
        // A missing minePropertyFile leaves the Copy without sources, so Gradle skips it as
        // NO-SOURCE; stopExecutionIfEmpty() was removed in Gradle 5.0.
    }

    task copyDefaultProperties(type: Copy) {
        description = "Copies default.intermine.properties file (from resources project) into resources output to be included in the war"
        // kept: writes into processResources' output dir, so it must run after it. To be folded
        // into processResources together with its users in dbmodel/ and webapp/ (Gradle Step 2a).
        dependsOn 'processResources'
        from({ zipTree(configurations.commonResources.singleFile) }) {
            include "default.intermine.test.properties"
        }
        into sourceSets.main.output.resourcesDir
        rename { fileName -> fileName.replace("default.intermine.test.properties", "default.intermine.properties") }
    }
}

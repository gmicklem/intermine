# Version catalog for the seven InterMine Gradle builds (plugin, intermine, bio, bio/sources, bio/postprocess,
# bio/postprocess-test, testmine). Each settings.gradle loads this file as `libs`; see
# decisions/gradle-upgrade-path.md section 6 in the planning repo.
#
# Every third-party coordinate of the module build files is declared here; the module build.gradle files use
# `libs.<alias>`. Not usable inside `buildscript { }` blocks (Gradle 7.6): those keep literal versions.

[versions]
# the InterMine release built from this tree (group org.intermine, all modules)
intermine = "5.1.1"
# 9.3: the last Checkstyle release that runs on Java 8 (10.x needs Java 11); see config/checkstyle/checkstyle.xml
checkstyle = "9.3"

# 1.10.x is the Java 8 line; 1.7.0 had 3 advisories. The InterMine tasks only use Task, BuildException, Project and
# FileSet/DirectoryScanner (stable API). Gradle runs them on its own bundled Ant.
ant = "1.10.18"
antlr = "2.7.6"
base64 = "2.3.8"
biojava = "4.2.0"
# Byte Buddy generates the classes of objects of more than one model class (org.intermine.util.DynamicBean; it replaced
# cglib 3.1 in 6.0, which needed --add-opens java.base/java.lang on JDK 16+). The release that easymock 5.7.0 brings to the
# test classpath, so there is one copy; vetted in decisions/package-vetting.md (im-jqz.6 test scope, im-jqz.29 runtime).
# 1.18.x runs on Java 8 and has no dependencies (ASM is shaded inside it).
byte-buddy = "1.18.12"
# 1.11.0 clears CVE-2025-48734 (the one advisory on 1.9.4); only pinned for Struts 1.3.10 (intermine/webapp), no InterMine code uses it
commons-beanutils = "1.11.0"
# 3.2.2: CVE-2015-7501 / CVE-2015-6420 (functor deserialisation); same API as 3.2
commons-collections = "3.2.2"
# 1.6.0 (not 1.5) clears all 6 advisories, the last being CVE-2025-48976; still javax.servlet and Java 8.
# Kept, not removed: Struts 1 multipart (CommonsMultipartRequestHandler) needs it.
commons-fileupload = "1.6.0"
# 2.x still runs on Java 8. IOUtils.toString/copy/toCharArray without a charset are deprecated in 2.x,
# so the InterMine callers pass "UTF-8"
commons-io = "2.22.0"
# only for BuildDbTask, the DDL task of the build: the torque 3.2-dev jars bundled in intermine-objectstore need it
# (lang.enum.Enum, lang.exception.NestableException, lang.StringUtils). It is declared in the configurations of the
# builds that run that task (the plugin's imTorqueRuntime, torqueRuntime of testresources and testmine/dbmodel), never
# on a compile or run time classpath. No InterMine code imports org.apache.commons.lang. Goes with torque.
commons-lang = "2.6"
# 3.x runs on Java 8; org.apache.commons.lang3 replaces org.apache.commons.lang (commons-lang 2.6, last release 2011).
# StringEscapeUtils and StrTokenizer/StrMatcher are deprecated in 3.x (moved to commons-text) but still there
commons-lang3 = "3.21.0"
# no imports, but the vendored torque jar (BuildDbTask) needs it at run time in every module that runs the Ant tasks
commons-logging = "1.3.5"
commons-math3 = "3.2"
dwr = "2.0.11-RELEASE"
# 5.x runs on Java 8 and brings its own objenesis (3.x) and byte-buddy
easymock = "5.7.0"
everit-json-schema = "1.14.6"
hikaricp = "4.0.3"
jackson = "2.18.12"
# javax.activation (the JavaBeans Activation Framework, removed from the JDK in 11); 1.2.x keeps the javax package
jakarta-activation = "1.2.1"
# bio/webapp (jami-core and the bridges)
jami = "3.2.12"
# bio/sources/psi-complexes: jami-core, jami-commons, jami-mitab and jami-xml, one release of the four
# (the parsers call the jami-core model classes). 3.2.9 is the newest 3.2.x in which all four exist:
# jami-mitab and jami-xml have no 3.2.10 - 3.2.12, and 3.3.x and later pull in a JAX-WS stack (and
# 3.9.x is Java 11 bytecode). The jars are on the EBI repository only, not on Maven Central.
jami-complexes = "3.2.9"
javax-mail = "1.4"
javax-servlet-api = "3.1.0"
jaxb-api = "2.3.1"
je = "4.0.92"
# Jena: only the RDF model API (org.apache.jena.rdf.model, org.apache.jena.vocabulary) is called, to build a Model and
# write it as RDF/XML, N-Triples or Turtle (RDFHelper, RDFProcessor, RDFOutput, RDFObject, R2RMLMappingProcess); nothing
# is parsed or stored. jena-core is the compile dependency; jena-arq (RIOT) must stay on the run-time classpath because
# with it Model.write() goes through the RIOT writers (N-Triples/Turtle output differs without it). apache-jena-libs
# (TDB, TDB2, SHACL, RDF connection) is not used and no longer pulled in.
# 3.17.0 is the last Jena release that runs on Java 8 (4.x needs 11, 5.x needs 17); moving on is a 6.0 item together with
# the Java 17 baseline (jena-core < 4.2.0 has CVE-2021-39239, an XXE in the RDF/XML parser, which InterMine never calls).
jena = "3.17.0"
json = "20260814"
jsonassert = "1.2.3"
jsp-api = "2.3.1"
jstl = "1.2"
junit = "4.13.2"
# Lucene 3 is live code, not a leftover of the Solr switch: SearchRepository builds an in-memory (RAMDirectory) index
# of a user's saved lists and templates and SearchResults/AjaxServices.filterWebSearchables query it (the filter box
# and tag filter of "My lists" and "Templates"; tags:x OR tags:y syntax, snowball stemming, highlighting). The
# keyword search, quick search, facets and autocomplete go through Solr instead. 3.0.2 has no advisory; moving to
# a Lucene 8/9 API (or dropping Lucene for plain Java matching) is a rewrite of those two classes, not a version bump.
lucene = "3.0.2"
oltu-client = "1.0.2"
opencsv = "2.4"
postgresql = "42.7.14"
reload4j = "1.2.22"
slf4j = "1.7.36"
# SolrJ follows the major version of the Solr server the mines run (the testbed and CI use 8.x); 8.11.4 is the last 8.x
# release (Maven Central lists no 8.11.5), and SolrJ 9 against a Solr 8 server is not supported, so a move to 9 goes with
# the Solr server upgrade (6.x/7.0 item). Only HttpSolrClient, SolrQuery and the schema requests are used; see
# intermine/api/build.gradle for the transitive jars that are excluded and for the ones that cannot be (zookeeper).
solr = "8.11.4"
struts = "1.3.10"
taglibs-string = "1.1.0"
# distribution zip for the cargo plugin (testmine/webapp); the @zip artifact type is added where it is used
tomcat = "9.0.115"
# one version for all modules (intermine/integrate used 1.6, the others 1.0; the 1.x API is the same)
xmlunit = "1.6"


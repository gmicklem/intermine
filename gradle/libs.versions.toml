# Version catalog for the seven InterMine Gradle builds (plugin, intermine, bio, bio/sources, bio/postprocess,
# bio/postprocess-test, testmine). Each settings.gradle loads this file as `libs`; see
# decisions/gradle-upgrade-path.md section 6 in the planning repo.
#
# Every third-party coordinate of the module build files is declared here; the module build.gradle files use
# `libs.<alias>`. Not usable inside `buildscript { }` blocks (Gradle 7.6): those keep literal versions.

[versions]
# the InterMine release built from this tree (group org.intermine, all modules)
intermine = "5.1.1"
# kept at 7.8.1 until the checkstyle bump (config/gradle/checkstyle-classpath.gradle)
checkstyle = "7.8.1"

ant = "1.7.0"
base64 = "2.3.8"
bcprov-jdk15on = "1.50"
biojava = "4.2.0"
cglib = "3.1"
commons-beanutils = "1.9.3"
# one version for intermine/webapp and testmine/webapp (testmine used 1.9)
commons-codec = "1.15"
commons-collections = "3.2"
commons-fileupload = "1.2.2"
commons-io = "1.2"
commons-lang = "2.6"
commons-logging = "1.3.5"
commons-math3 = "3.2"
dwr = "2.0.1"
easymock = "3.2"
everit-json-schema = "1.14.6"
hikaricp = "4.0.3"
jackson = "2.18.12"
# bio/webapp and bio/sources/psi-complexes (jami-core) both use this
jami = "3.2.12"
# jami-commons, jami-mitab, jami-xml as used by bio/sources/psi-complexes (3.0.0, not bumped with jami-core)
jami-v3 = "3.0.0"
javax-annotation-api = "1.3.2"
javax-mail = "1.4"
javax-servlet-api = "3.1.0"
javax-ws-rs-api = "2.0.1"
# jakarta.xml.bind-api and jaxb-runtime are released together
jaxb = "2.3.2"
jaxb-api = "2.3.1"
je = "4.0.92"
jena = "3.16.0"
jersey = "2.25"
jopenid = "1.08"
json = "20260814"
jsonassert = "1.2.3"
jsp-api = "2.3.1"
jstl = "1.2"
junit = "4.8.2"
lucene = "3.0.2"
mockobjects = "0.09"
objenesis = "2.1"
oltu-client = "1.0.1"
oltu-common = "1.0.0"
opencsv = "2.4"
postgresql = "42.7.14"
reload4j = "1.2.22"
slf4j = "1.7.36"
solr = "8.11.4"
struts = "1.3.10"
taglibs-string = "1.1.0"
# one version for all modules (intermine/integrate used 1.6, the others 1.0; the 1.x API is the same)
xmlunit = "1.6"

[libraries]
ant = { module = "org.apache.ant:ant", version.ref = "ant" }
base64 = { module = "net.iharder:base64", version.ref = "base64" }
bcprov-jdk15on = { module = "org.bouncycastle:bcprov-jdk15on", version.ref = "bcprov-jdk15on" }
biojava-core = { module = "org.biojava:biojava-core", version.ref = "biojava" }

apply plugin: 'antlr'

sourceSets {
    main {
        // The antlr plugin (7.6 and 8.14 alike) adds build/generated-src/antlr/main to the java sources as a plain
        // directory and only makes compileJava depend on generateGrammarSource, so sourcesJar reads that directory
        // without knowing its producer. Replace the plain directory with the task: same directory, but now carrying
        // the task dependency for every consumer of the source set.
        java {
            srcDirs = ['src/main/java', tasks.named('generateGrammarSource')]
        }
        antlr {
            srcDirs = ['src/main/antlr']
        }
    }
}

configurations {
    // jars that are not resolved from a repository but packed into this module's own jar (see the jar block)
    bundled
    implementation.extendsFrom bundled

    all {
        exclude group: 'org.apache.logging.log4j'
    }
}

// the unit tests need the databases that testresources:buildDB creates (a side effect, so there is no file to wire as an input)
tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    api project(':intermine-model')
    api libs.postgresql
    api libs.commons.io
    api libs.commons.beanutils
    implementation(libs.hikaricp) { transitive = false } // conflict with log4j library this JAR needs
    api libs.reload4j
    api libs.slf4j.reload4j

    api libs.base64 //not clear wich version is currently used
    implementation libs.opencsv //version 2.3 not available in maven
    testImplementation libs.mockobjects.core
    testImplementation libs.mockobjects.jdk13
    bundled fileTree(dir: 'libs', include: '*.jar') // eventually replace torque
    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    antlr name: 'antlr-2.7.6-caching'
}

jar {
    // put all the JARs included in `bundled` config and include them in the JAR
    // (the bundled jars all ship a META-INF/LICENSE.txt: keep the first one)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        (configurations.bundled).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

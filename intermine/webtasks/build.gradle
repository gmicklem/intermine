sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    // intermine-api is declared explicitly (the tasks use its types): it used to come in through webapp's providedCompile
    api project(':intermine-api')
    api project(':intermine-webapp')
    testImplementation project(':intermine-objectstore')
    testImplementation project(':intermine-resources')
    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
}

// the POM names intermine-webapp:classes (the jar), not the war
apply from: "${rootDir}/../config/gradle/webapp-classes-dependency.gradle"

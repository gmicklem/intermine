// Prevent the build target from building an empty compile jar
// we only have testCompile classes and we want them to be in the jar instead via the buildTestModelJar target
jar.enabled = false

configurations {
    testArtifacts
    commonResources
}

dependencies {
    commonResources project(':intermine-resources')

     // We need this dependency because the pre-generated userprofile classes and model XML are here, which is necessary to build the userprofile-test db
    testImplementation project(':intermine-api')
    testImplementation project(':intermine-objectstore')
    testImplementation libs.commons.lang
}

void generateModel(model, destination, type) {
    ant.taskdef(name: 'modelOutputTask', classname: 'org.intermine.task.ModelOutputTask') {
        classpath {
            fileset(dir: '../model/build/libs/', includes: '*.jar')
            dirset(dir: 'src/test/resources/')
            pathelement(path: configurations.testRuntimeClasspath.asPath)
        }
    }

    ant.modelOutputTask(model: model, destDir: destination, type: type)
}

// The generated test model sources (eg. Employee.java) go to a declared output directory under build/, not into
// the source tree. Registering the task as a test source directory makes compileTestJava (and everything that
// needs the test classes) depend on it without an explicit dependsOn.
def testModelSourceDir = layout.buildDirectory.dir('generated/sources/testmodel')
def generateTestModel = tasks.register('generateTestModel') {
    description = "generate the testmodel Java files from the data model, eg. Employee.java"
    // the Ant task classpath is resolved when the task runs: declare it as an input so that the jars are built first
    inputs.files(configurations.testRuntimeClasspath)
    // the model (testmodel_model.xml) is read from this directory, which is on the Ant task classpath
    inputs.dir('src/test/resources')
    outputs.dir(testModelSourceDir)
    doLast {
        def destination = testModelSourceDir.get().asFile
        // classes of a removed model class must not survive
        project.delete(destination)
        destination.mkdirs()
        generateModel('testmodel', destination.path, 'java')
    }
}
sourceSets.test.java.srcDir(generateTestModel)

// Until 2026-11 generateTestModel wrote into src/test/java (gitignored). A checkout that still has
// those files gets "duplicate class" errors, so clean removes the legacy directory. Drop in 2027.
tasks.named('clean') { delete 'src/test/java' }

void insertDataModel(model, osname) {
    ant.taskdef(name: 'insertModelTask', classname: 'org.intermine.task.StoreMetadataTask') {
        classpath {
            fileset(dir: '../model/build/libs/', includes: '*.jar')
            dirset(dir: 'src/test/resources/')
            dirset(dir: 'build/') // intermine.properties
            pathelement(path: configurations.testRuntimeClasspath.asPath)
        }
    }

    ant.insertModelTask(osname: osname, modelName: model)
}

task insertModel (dependsOn: 'buildDB') {
    description = "put the generated model file into the intermine_metadata table"
    inputs.files(configurations.testRuntimeClasspath)

    doLast {
        insertDataModel('testmodel', 'os.unittest')
    }
}

// src/test/resources/intermine-test.properties is a template: processTestResources replaces it with the
// developer's ~/.intermine/intermine-test.properties, renamed to intermine.properties
sourceSets.test.resources.exclude 'intermine-test.properties'

processTestResources {
    // default.intermine.test.properties (from the resources project) is copied into the resources output so that it
    // is included in the war; it was copied by a separate Copy task before
    inputs.files(configurations.commonResources)
    from({ zipTree(configurations.commonResources.singleFile) }) {
        include "default.intermine.test.properties"
        rename "default.intermine.test.properties", "default.intermine.properties"
    }

    def intermineTestPropertiesPath = "${System.env.HOME}/.intermine/intermine-test.properties"
    def intermineTestProperties = file(intermineTestPropertiesPath)

    doFirst {
        if (!intermineTestProperties.exists()) {
            throw new GradleException("Required file not found: $intermineTestPropertiesPath")
        }

        println "Using InterMine test properties path: '$intermineTestPropertiesPath'"
    }

    from(intermineTestPropertiesPath) {
        rename 'intermine-test.properties', 'intermine.properties'
    }
}

task buildTestModelJar(type: Jar) {
    // the test output carries the dependency on compileTestJava and processTestResources
    from(sourceSets.test.output)
}

// providers.exec (Gradle 7.5+) replaces Project.exec, which is deprecated in 8.11 and removed in 9.0. It runs the
// command when its output is read, and does not take streams: stdout and stderr come back separately.
String psqlOutput(execOutput) {
    (execOutput.standardOutput.asText.get() + execOutput.standardError.asText.get()).trim()
}

void createDbInternal(dbName) {
    println 'Creating database ' + dbName
    def result = psqlOutput(providers.exec {
        ignoreExitValue = true
        // Admin connection without sudo (newer sudo ignores -E): PGUSER/PGPASSWORD, default postgres/postgres
        environment PGPASSWORD: (System.getenv('PGPASSWORD') ?: 'postgres')
        commandLine 'psql', '-w', '-h', 'localhost', '-U', (System.getenv('PGUSER') ?: 'postgres'), '-c', "create database \"" + dbName + "\";"
    })

    if (result.contains('database "' + dbName + '" already exists')) {
        println 'Already exists.'
    } else if (result.contains("CREATE DATABASE")) {
        println 'Created.'
    } else {
        throw new GradleException("FAILED:\n${result}")
    }
}

void grantPrivileges(dbName) {
    println 'Grant privileges on database ' + dbName
    def result = psqlOutput(providers.exec {
        ignoreExitValue = true
        // Admin connection without sudo (newer sudo ignores -E): PGUSER/PGPASSWORD, default postgres/postgres
        environment PGPASSWORD: (System.getenv('PGPASSWORD') ?: 'postgres')
        commandLine 'psql', '-w', '-h', 'localhost', '-U', (System.getenv('PGUSER') ?: 'postgres'), '-c', "grant all privileges on database \"" + dbName + "\" to test;"
    })

    if (result.contains("GRANT")) {
        println 'Granted.'
    } else {
        throw new GradleException("FAILED:\n${result}")
    }

    // PostgreSQL 15 and later: only the database owner may create objects in the public schema, so a
    // non-superuser test user needs an explicit grant (the superuser used locally does not).
    def schemaResult = psqlOutput(providers.exec {
        ignoreExitValue = true
        environment PGPASSWORD: (System.getenv('PGPASSWORD') ?: 'postgres')
        commandLine 'psql', '-w', '-h', 'localhost', '-U', (System.getenv('PGUSER') ?: 'postgres'), '-d', dbName, '-c', "grant all on schema public to test;"
    })
    if (!schemaResult.contains("GRANT")) {
        throw new GradleException("FAILED:\n${schemaResult}")
    }
}

task createUnitTestDatabases {
    description = "create databases needed for unit tests"
    doLast {
        // just fail silently if DB is already there. Instead we could read in the list of DBs and only
        // create ones that aren't there
        createDbInternal('notxmltest')
        grantPrivileges('notxmltest')
        createDbInternal('truncunittest')
        grantPrivileges('truncunittest')
        createDbInternal('flatmodetest')
        grantPrivileges('flatmodetest')
        createDbInternal('fulldatatest')
        grantPrivileges('fulldatatest')
        createDbInternal('userprofile-test')
        grantPrivileges('userprofile-test')
        createDbInternal('unittest')
        grantPrivileges('unittest')
    }
}

// this only works correctly after you stop the gradlew process. --stop. otherwise it keeps the connection to unittest
// this is incorrect as the tests should drop the database connections themselves
task dropDBs {
    description = "drop all the test databases. used for debugging only."
    doLast {
        // fail silently if a database is not there
        ['notxmltest', 'truncunittest', 'flatmodetest', 'fulldatatest', 'userprofile-test', 'unittest', 'bio-test',
         'bio-fulldata-test'].each { dbName ->
            println psqlOutput(providers.exec {
                ignoreExitValue = true
                commandLine 'psql', '-d', 'postgres', '-c', "drop database \"" + dbName + "\";"
            })
        }
    }
}

void createTables(osname, model) {
    println 'Setting up InterMine tables in ' + osname + ' and inserting XML for ' + model

    ant.taskdef(name: 'buildDBUnittest', classname: 'org.intermine.task.BuildDbTask') {
        classpath {
            pathelement(path: configurations.testRuntimeClasspath.asPath)
            dirset(dir: 'build/') // testmodel classes and schemas
            dirset(dir: 'src/test/resources/') // testmodel classes and schemas
        }
    }
    ant.buildDBUnittest(osname: "os.$osname", model: "$model", schemafile:"os.$osname-schema.xml", tempDir: layout.buildDirectory.dir("tmp").get().asFile.path)
    ant.taskdef(name: 'insertModel', classname: 'org.intermine.task.StoreMetadataTask') {
        classpath {
            pathelement(path: configurations.testRuntimeClasspath.asPath)
            dirset(dir: 'build/') // testmodel classes and schemas
            dirset(dir: 'src/test/resources/') // testmodel classes and schemas
        }
    }
    ant.insertModel(osname: "os.$osname", modelName: "$model")
    // <create-indexes alias="${objectstore.name}" />
    // <analyse-db osName="${objectstore..name}"/>
}

void generateSchema(osname, model) {
    ant.taskdef(name: 'torque', classname: 'org.intermine.objectstore.intermine.TorqueModelOutputTask') {
        classpath {
            pathelement(path: configurations.testRuntimeClasspath.asPath)
            dirset(dir: 'build/') // testmodel classes and intermine.properties
            dirset(dir: 'src/test/resources') // testmodel_model.xml
        }
    }
    ant.torque(osname: "os.$osname", destFile: layout.buildDirectory.file("os.${osname}-schema.xml").get().asFile.path)
}

task buildDB {
    // the Ant tasks load the test model classes from build/ (not a declared input) and need the databases
    dependsOn 'compileTestJava'
    dependsOn 'createUnitTestDatabases'
    description = "Create tables for database for intermine tests"
    inputs.files(configurations.testRuntimeClasspath)
    doLast {
        generateSchema('unittest', 'testmodel')
        createTables('unittest', 'testmodel')

        generateSchema('truncunittest', 'testmodel')
        createTables('truncunittest', 'testmodel')

        generateSchema('notxmlunittest', 'testmodel')
        createTables('notxmlunittest', 'testmodel')

        generateSchema('flatmodeunittest', 'testmodel')
        createTables('flatmodeunittest', 'testmodel')

        generateSchema('userprofile-test', 'userprofile')
        createTables('userprofile-test', 'userprofile')

        // don't need to generate schema, never changes
        createTables('fulldatatest', 'fulldata')
    }
}

artifacts {
    testArtifacts buildTestModelJar
}

// The main jar task is disabled at the top of this file: the jar published as intermine-testresources-<version>.jar
// is the test model jar (test model, data and classes), as in 5.1.0. config/gradle/publishing.gradle reads this.
ext.imMainJarTask = buildTestModelJar

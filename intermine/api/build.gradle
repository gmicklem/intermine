sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// the unit tests need the databases that testresources:buildDB creates (a side effect, so there is no file to wire as an input)
tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    api project(':intermine-pathquery')
    api project(':intermine-integrate')
    // InterMine only uses SolrJ's HttpSolrClient (Apache HttpClient), SolrQuery and the schema requests. The Netty,
    // Jetty (HTTP/2 client) and Snappy jars that solr-solrj 8.11.4 lists are for Http2SolrClient and the SolrCloud/
    // ZooKeeper client, which are never loaded; about 25 advisory entries (Netty, Jetty, snappy-java) are not
    // shipped. ZooKeeper itself stays, because HttpSolrClient's javabin decoding calls
    // org.apache.zookeeper.server.ByteBufferInputStream.
    api(libs.solr.solrj) {
        exclude group: 'io.netty'
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.http2'
        exclude group: 'org.xerial.snappy'
        exclude group: 'commons-lang', module: 'commons-lang' // 2.6, for solrj's own legacy code that InterMine does not use
    }
    api libs.lucene.core
    implementation libs.lucene.snowball
    implementation libs.lucene.highlighter
    api libs.json
    api libs.jena.core
    // Model.write() uses the RIOT writers only when jena-arq is present, so the RDF output depends on it at run time
    runtimeOnly libs.jena.arq
    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation libs.xmlunit
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(':intermine-resources')
}


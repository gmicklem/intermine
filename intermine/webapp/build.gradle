apply plugin: 'war'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// the unit tests need the databases that testresources:buildDB creates (a side effect, so there is no file to wire as an input)
tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    providedCompile project(':intermine-api')

    api group: 'org.directwebremoting', name: 'dwr', version: '2.0.1'
    api group: 'org.apache.lucene', name: 'lucene-core', version: '3.0.2'
    api(group: 'org.apache.solr', name: 'solr-solrj', version: '8.11.4') {
        exclude group: 'io.netty'
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.http2'
        exclude group: 'org.xerial.snappy'
    } // same exclusions as intermine-api
    api group: 'javax.mail', name: 'mail', version: '1.4'
    // Struts 1.3.10 asks for antlr 2.7.2, which would sit in WEB-INF/lib next to the antlr 2.7.6 that every mine's
    // dbmodel brings (the parser of the InterMine query language); the antlr classes are the same library
    ['struts-core', 'struts-taglib', 'struts-extras', 'struts-tiles'].each { strutsModule ->
        api(group: 'org.apache.struts', name: strutsModule, version: '1.3.10') { exclude group: 'antlr', module: 'antlr' }
    }
    api group: "javax.servlet", name: "jstl", version: "1.2"
    api group: 'commons-fileupload', name: 'commons-fileupload', version: '1.6.0'
    api group: 'com.github.erosb', name: 'everit-json-schema', version: '1.14.6' // formerly org.everit.json:org.everit.json.schema (same library, groupId moved)
    api 'org.apache.oltu.oauth2:org.apache.oltu.oauth2.client:1.0.2' // brings oltu common 1.0.2: the one oltu version of the POM
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.12'
    api 'com.fasterxml.jackson.jaxrs:jackson-jaxrs-json-provider:2.18.12' // align jersey-media-json-jackson's 2.8.4 Jackson modules
    // Jersey's hk2 packages javax.inject twice: javax.inject:javax.inject:1 and its repackaging
    // org.glassfish.hk2.external:javax.inject:2.5.0-b30 (same classes); keep the first only
    api(group: 'org.glassfish.jersey.media', name: 'jersey-media-json-jackson', version: '2.25') {
        exclude group: 'org.glassfish.hk2.external', module: 'javax.inject'
    }
    api group: 'javax.ws.rs', name: 'javax.ws.rs-api', version: '2.0.1'
    api(group: 'org.glassfish.jersey.core', name: 'jersey-client', version: '2.25') {
        exclude group: 'org.glassfish.hk2.external', module: 'javax.inject'
    }
    api group: 'org.apache.jena', name: 'jena-core', version: '3.17.0'
    api group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'

    api files('libs/stringtree-json-2.0.5.jar')
    providedCompile group: 'javax.servlet.jsp', name: 'javax.servlet.jsp-api', version: '2.3.1'
    providedCompile group: 'org.expressme', name: 'JOpenId', version: '1.08'
    api group: 'org.apache.commons', name: 'commons-math3', version: '3.2'
    providedCompile group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.50'

    runtimeOnly group: 'commons-io', name: 'commons-io', version: '1.2'
    runtimeOnly group: 'commons-collections', name: 'commons-collections', version: '3.2.2'
    runtimeOnly group: 'commons-lang', name: 'commons-lang', version: '2.6'
    runtimeOnly group: 'commons-codec', name: 'commons-codec', version: '1.15'
    runtimeOnly 'taglibs:string:1.1.0'
    runtimeOnly group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    runtimeOnly group: 'org.json', name: 'json', version: '20260814'

    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(':intermine-api').sourceSets.test.output
    testImplementation group: 'org.objenesis', name: 'objenesis', version: '2.1'
    testImplementation group: 'org.easymock', name: 'easymock', version: '3.2'
    testImplementation group: 'xmlunit', name: 'xmlunit', version: '1.0'
    testImplementation group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
}

task classesJar(type: Jar) {
    archiveClassifier.set('classes')
    from sourceSets.main.output
}


// published next to the war, as the 'classes' classifier (bio-webapp compiles against it)
publishing.publications.configureEach {
    artifact classesJar
}

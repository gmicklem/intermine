apply plugin: 'war'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// the unit tests need the databases that testresources:buildDB creates (a side effect, so there is no file to wire as an input)
tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    providedCompile project(':intermine-api')

    api libs.dwr
    api libs.lucene.core
    api libs.solr.solrj
    api libs.javax.mail
    // Struts 1.3.10 asks for antlr 2.7.2, which would sit in WEB-INF/lib next to the antlr 2.7.6 that every mine's
    // dbmodel brings (the parser of the InterMine query language); the antlr classes are the same library
    [libs.struts.core, libs.struts.taglib, libs.struts.extras, libs.struts.tiles].each {
        api(it) { exclude group: 'antlr', module: 'antlr' }
    }
    api libs.jstl
    api libs.commons.fileupload
    api libs.everit.json.schema // formerly org.everit.json:org.everit.json.schema (same library, groupId moved)
    api libs.oltu.client
    api libs.jackson.databind
    api libs.jena.core
    api libs.javax.servlet.api

    providedCompile libs.jsp.api
    api libs.commons.math3

    // no InterMine code uses commons-beanutils, but Struts 1.3.10 needs it at run time and asks for the
    // vulnerable 1.8.0; this keeps the patched version in the war
    runtimeOnly libs.commons.beanutils
    runtimeOnly libs.commons.io
    runtimeOnly libs.commons.collections
    runtimeOnly libs.taglibs.string
    runtimeOnly libs.jaxb.api
    runtimeOnly libs.json

    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(':intermine-api').sourceSets.test.output
    testImplementation libs.easymock
    testImplementation libs.xmlunit
    // only the four JSON formatter tests use it (it used to be a compile dependency of intermine-model)
    testImplementation libs.jsonassert
    testImplementation libs.javax.servlet.api
}

task classesJar(type: Jar) {
    archiveClassifier.set('classes')
    from sourceSets.main.output
}


// published next to the war, as the 'classes' classifier (bio-webapp compiles against it)
publishing.publications.configureEach {
    artifact classesJar
}

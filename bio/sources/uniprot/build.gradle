sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    // UniprotXmlFilterTest compares XML documents (assertXMLEqual); no other source test does
    testImplementation libs.xmlunit
    runtimeOnly(libs.bio.model) { transitive = false }
    api libs.intermine.integrate
    bioModel(libs.bio.model) { transitive = false }
}

processResources {
    from('.') { include ("*.properties")}
}

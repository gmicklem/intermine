sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    implementation group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
    api group: 'org.intermine', name: 'intermine-integrate', version: imVersion
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.18.12'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.12'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.18.12'
    runtimeOnly fileTree(dir: 'libs', include: '*.jar') //antlr-2.7.6-caching.jar
    bioModel group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
}

processResources {
    from('.') { include ("*.properties")}
}

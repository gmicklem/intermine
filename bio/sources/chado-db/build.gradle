sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    api group: 'org.intermine', name: 'bio-core', version: bioVersion, transitive: false
    api group: 'org.intermine', name: 'intermine-integrate', version: imVersion
    bioModel group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
}

processResources {
    from('.') { include ("*.properties")}
}

// the plugin's mergeModels writes the merged model into build/im/mergeModels (its output directory); this merges the
// FlyBase additions into it too
mergeModels {
    doLast {
        ant.taskdef(name: "mergeBioSourceModel", classname: "org.intermine.task.ModelMergerTask") {
            classpath {
                pathelement(path: configurations.mergeModel.asPath)
                dirset(dir: layout.buildDirectory.get().asFile)
            }
        }
        def model = layout.buildDirectory.file('im/mergeModels/genomic_model.xml').get().asFile
        ant.mergeBioSourceModel(inputModelFile: model, additionsFile: "flybase-chado-db_additions.xml", outputFile: model)
    }
}

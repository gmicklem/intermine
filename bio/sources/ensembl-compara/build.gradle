sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    api libs.intermine.integrate
    runtimeOnly(libs.bio.model) { transitive = false } //to read genomic_keyDefs.properties
    bioModel(libs.bio.model) { transitive = false }
}


processResources {
    from('.') { include ("*.properties")}
}

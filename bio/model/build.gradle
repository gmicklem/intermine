buildscript {
    repositories {
        ivy {
            // define in ~/.gradle/gradle.properties
            // intermine.plugin.repo=file:///your/intermine/repo/plugin/build/libs
            url project.getProperty("intermine.plugin.repo")
            layout "pattern", {
                artifact  "[artifact]-[revision].[ext]"
            }
            metadataSources {
                artifact()
            }
        }
        maven {
            url project.getProperty("intermine.maven.central")
        }
    }
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

apply plugin: 'dbmodel'
apply plugin: 'biomodel-dbmodel'

sourceSets {
    main {
        java {
            srcDirs = ['build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

processResources {
    from('.') { include ("core.xml", "genomic_additions.xml")}
    // bio-model is the source of genomic_model.xml: start it from core.xml; mergeModels then merges
    // genomic_additions.xml into it in place. This replaces the plugin's copyGenomicModel, which
    // unpacks genomic_model.xml from the bioModel dependency (bio-model itself).
    from('.') {
        include 'core.xml'
        rename { 'genomic_model.xml' }
    }
}

dependencies {
    compile group: "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
    compile group: "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion")
    compile fileTree(dir: 'libs', include: '*.jar')
    compile 'commons-lang:commons-lang:2.6'
    compile group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.22'
    compile group: 'org.slf4j', name: 'slf4j-reload4j', version: '1.7.36'
}

dbModelConfig {
    objectStoreName = "os.bio-test"
    modelName = "genomic"
    defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
}

task copyMineProperties(type: Copy) {
    from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
    into sourceSets.main.output.resourcesDir
    rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
}

// Gradle 6 forbids replacing a task the plugin has already created (overwrite: true); genomic_model.xml
// now comes from processResources above.
tasks.getByName('copyGenomicModel') { enabled = false }

// lifecycle: buildDB needs the (empty) test databases to exist; no file output to wire.
tasks.buildDB.dependsOn ':bio-testresources:createUnitTestDatabases'
// mergeModels reads and rewrites genomic_model.xml in the processResources output.
tasks.mergeModels.inputs.files(processResources)
// kept: both tasks write intermine.properties / default.intermine.properties into the resources dir
// that the jar packs, and copyDefaultInterMineProperties (plugin) declares no outputs. They are
// folded into processResources in Gradle Step 2a.
tasks.mergeModels.dependsOn 'copyMineProperties', 'copyDefaultInterMineProperties'

buildscript {
    repositories {
        ivy {
            // define in ~/.gradle/gradle.properties
            // intermine.plugin.repo=file:///your/intermine/repo/plugin/build/libs
            url = project.getProperty("intermine.plugin.repo")
            patternLayout {
                artifact  "[artifact]-[revision].[ext]"
            }
            metadataSources {
                artifact()
            }
        }
        maven {
            url = project.getProperty("intermine.maven.central")
        }
    }
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

apply plugin: 'dbmodel'
apply plugin: 'biomodel-dbmodel'

sourceSets {
    main {
        java {
            srcDirs = ['build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

processResources {
    from('.') { include ("core.xml", "genomic_additions.xml")}
    // bio-model is the source of genomic_model.xml: start it from core.xml; mergeModels then merges
    // genomic_additions.xml into it in place. This replaces the plugin's copyGenomicModel, which
    // unpacks genomic_model.xml from the bioModel dependency (bio-model itself).
    from('.') {
        include 'core.xml'
        rename { 'genomic_model.xml' }
    }
}

dependencies {
    // the generated model classes extend and use the types of these two
    api group: "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
    api group: "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion")
    api libs.commons.lang3
    // commons-lang 2.6: run time only, for the bundled torque jars of intermine-objectstore (they extend
    // lang.enum.Enum and use lang.exception.NestableException); this build does not take objectstore's own dependencies
    runtimeOnly libs.commons.lang
    api libs.reload4j
    implementation libs.slf4j.reload4j // logging binding (runtime scope in the POM)
}

dbModelConfig {
    objectStoreName = "os.bio-test"
    modelName = "genomic"
    defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
}

// The test mine's intermine.properties goes into the resources output through processResources (the plugin's
// tasks read it from there by the task name).
task copyMineProperties(type: Copy) {
    from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
    into layout.buildDirectory.dir('im/mine-properties')
    rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
}

processResources {
    from copyMineProperties
}

// Gradle 6 forbids replacing a task the plugin has already created (overwrite: true); genomic_model.xml
// now comes from processResources above.
tasks.named('copyGenomicModel') { enabled = false }

// lifecycle: buildDB needs the (empty) test databases to exist; no file output to wire.
tasks.named('buildDB') { dependsOn ':bio-testresources:createUnitTestDatabases' }
// kept: copyDefaultInterMineProperties (plugin) writes default.intermine.properties into the resources dir
// that the jar packs and declares no outputs, so there is nothing to wire as an input.
tasks.named('mergeModels') { dependsOn 'copyDefaultInterMineProperties' }

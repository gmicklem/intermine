sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    bioModel group: 'org.intermine', name: 'bio-source-flymine-static', version: flymineVersion, transitive: false
    implementation group: 'org.intermine', name: 'bio-source-flymine-static', version: flymineVersion, transitive: false
    implementation libs.bio.postprocess.create.intron.features
}

processResources {
    from('.') { include ("*.properties")}
}

apply plugin: 'war'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

def explodedWebAppDir = "$buildDir/explodedWebApp"

configurations {
    imWebApp
}

dependencies {
    providedCompile project(':bio-core')
    providedCompile project(':bio-model')
    providedCompile group: "org.intermine", name: "intermine-webapp", version: System.getProperty("imVersion"), classifier: "classes"
    providedCompile group: 'org.apache.struts', name: 'struts-tiles', version: '1.3.10'
    providedCompile group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'

    // api: types that appear in the public or protected signatures of the classes in the bio-webapp classes jar
    api (project(':bio-tools')) { transitive = false }
    api group: "org.intermine", name: "intermine-jbrowse-endpoint", version: System.getProperty("imVersion")
    api group: 'psidev.psi.mi.jami', name: 'jami-core', version: '3.2.12'
    api group: "org.biojava", name: "biojava-core", version: "4.2.0"
    // implementation: used inside method bodies only
    implementation group: 'commons-io', name: 'commons-io', version: '1.2'
    implementation group: 'psidev.psi.mi.jami.bridges', name: 'bridges-core', version: '3.2.12'
    implementation group: 'psidev.psi.mi.jami.bridges', name: 'jami-ols', version: '3.2.12'
    implementation group: 'psidev.psi.mi.jami', name: 'jami-interactionviewer-json', version: '3.2.12'
    implementation group: "org.biojava", name: "biojava-ontology", version: "4.2.0"
    implementation group: 'org.json', name: 'json', version: '20260814'

    runtimeOnly group: 'org.apache.lucene', name: 'lucene-snowball', version: '3.0.2'

    imWebApp group: "org.intermine", name: "intermine-webapp", version: System.getProperty("imVersion"), transitive: false, ext: "war"
}

task unwarIMWebApp(type: Copy) {
    description "Unwar intermine-webapp under the build/explodedWebAppDir directory"
    from { zipTree(configurations.imWebApp.singleFile) }
    into explodedWebAppDir
}

// bio-webapp's war is the intermine-webapp war with the bio classes and libraries added
war {
    from unwarIMWebApp
    // intermine-webapp's WEB-INF/lib and the runtime classpath can hold the same jar; keep the first
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task classesJar(type: Jar) {
    archiveClassifier.set('classes')
    from sourceSets.main.output
}

// published next to the war, as the 'classes' classifier
publishing.publications.configureEach {
    artifact classesJar
}

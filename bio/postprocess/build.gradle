buildscript {
    repositories {
        ivy {
            // define in ~/.gradle/gradle.properties
            // intermine.plugin.repo=file:///your/intermine/repo/plugin/build/libs
            url = project.getProperty("intermine.plugin.repo")
            patternLayout {
                artifact  "[artifact]-[revision].[ext]"
            }
            metadataSources {
                artifact()
            }
        }

        maven {
            url = project.getProperty("intermine.maven.central")
        }
    }
    // the version catalog (libs) is not available in buildscript {} on Gradle 7.6: the plugin version comes from the
    // imVersion system property (gradle.properties), as for the deployer mines
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

// `centralBundle`: zip of all signed publications for the Maven Central Portal (docs/RELEASING.md)
apply from: "${rootDir}/../../config/gradle/central-bundle.gradle"

ext {
    // set here to make available to individual bio-postprocesses
    bioVersion = System.getProperty("bioVersion")
    imVersion = System.getProperty("imVersion")
}

subprojects {
    group = 'org.intermine'
    version = libs.versions.intermine.get()

    apply plugin: 'java'
    apply plugin: 'dbmodel'
    apply plugin: 'biocore-dbmodel'
    apply plugin: "checkstyle"

    // Java 8 bytecode whatever the build JDK; --release 8 on JDK 9+
    apply from: "${rootDir}/../../config/gradle/java-target.gradle"

    // -------------------------
    // Build localDirs list
    // -------------------------

    def intermineLocalDirs = []
    def intermineRootDir = project.getProperty("intermine.development.intermineRootDir")
    def intermineModules = project.getProperty("intermine.development.intermineModules")

    if (intermineRootDir && intermineModules) {
        def modules = intermineModules.split(',').collect { it.trim() }.findAll { it }
        intermineLocalDirs = modules.collect {
            module -> "${intermineRootDir}/${module}/build/libs"
        }
    }

    def bioLocalDirs = []
    def bioRootDir = project.getProperty("intermine.development.bioRootDir")
    def bioModules = project.getProperty("intermine.development.bioModules")

    if (bioRootDir && bioModules) {
        def modules = bioModules.split(',').collect { it.trim() }.findAll { it }
        bioLocalDirs = modules.collect {
            module -> "${bioRootDir}/${module}/build/libs"
        }
    }

    def localDirs = intermineLocalDirs + bioLocalDirs

    repositories {
        // Prefer locally-built InterMine artifacts
        localDirs.each { dir ->
            ivy {
                url = "file://" + dir
                patternLayout {
                    artifact  "[artifact]-[revision](-[classifier]).[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }
        maven {
            url = project.getProperty("intermine.maven.central")
        }
    }

    configurations {
        mergeModel
    }

    dependencies {
        implementation(libs.hikaricp) { transitive = false }
        implementation libs.reload4j
        implementation libs.slf4j.reload4j
        implementation libs.ant
        implementation(libs.solr.solrj) {
            exclude group: 'io.netty'
            exclude group: 'org.eclipse.jetty'
            exclude group: 'org.eclipse.jetty.http2'
            exclude group: 'org.xerial.snappy'
        } // same exclusions as intermine-api
        implementation group: 'org.intermine', name: 'bio-core', version: System.getProperty("bioVersion"), transitive: false
        implementation group : "org.intermine", name: "intermine-integrate", version: System.getProperty("imVersion")
        implementation group : "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
        implementation group : "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion")
        implementation group : "org.intermine", name: "intermine-resources", version: System.getProperty("imVersion") // log4j
        implementation libs.commons.collections
        implementation libs.commons.lang3
        // commons-lang 2.6: run time only, for the bundled torque jars of intermine-objectstore (they extend
        // lang.enum.Enum and use lang.exception.NestableException); this build does not take objectstore's own dependencies
        runtimeOnly libs.commons.lang
        implementation libs.postgresql

        testImplementation libs.junit
        testImplementation group: "org.intermine", name: "intermine-integrate", version: System.getProperty("imVersion")
        testImplementation libs.xmlunit
        mergeModel group : "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion")
    }

    dbModelConfig {
        objectStoreName = "os.bio-test"
        modelName = "genomic"
        defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
    }

    // The test mine's intermine.properties reaches the resources output through processResources, so every reader of
    // that directory (jar, the tests, the plugin's tasks, which name copyMineProperties as the producer) sees who wrote it.
    task copyMineProperties(type: Copy) {
        from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
        into layout.buildDirectory.dir('im/mine-properties')
        rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
    }

    processResources {
        from copyMineProperties
    }

    // see http://blog.joda.org/2014/02/turning-off-doclint-in-jdk-8-javadoc.html
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')

        // https://github.com/gradle/gradle/issues/2354
        // The '-quiet' as second argument is actually a hack,
        // since the one paramater addStringOption doesn't seem to
        // work, we extra add '-quiet', which is added anyway by
        // gradle. See https://github.com/gradle/gradle/issues/2354
        // See JDK-8200363 (https://bugs.openjdk.java.net/browse/JDK-8200363)
        // for information about the -Xwerror option.
        options.addStringOption('Xwerror', '-quiet')
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        configFile = file("${rootDir}/../../config/checkstyle/checkstyle.xml")
        sourceSets = [sourceSets.main]
        showViolations = true
        ignoreFailures = false
        maxWarnings = 0
        //reportsDir = file("$project.rootDir/reports/checkstyle/$project.name")
        configProperties = [
                'checkstyle.header.file': "${rootDir}/../../config/checkstyle/copyright_header.txt",
                'suppressionFile': "${rootDir}/../../config/checkstyle/suppressions.xml"
        ]
    }

    checkstyleMain {
        source = fileTree('src/main') {
            includes = ['**/*.java']
            excludes = ['build/**']
        }
    }

    checkstyleTest {
        enabled = false
    }

    tasks.withType(Test) {
        scanForTestClasses = false
        include '**/*Test.class'
    }

    test {
        // we have a system property that we need to get to the tests
        systemProperties System.properties
        ignoreFailures = true
        forkEvery = 1
    }

    // Publishing (maven-publish, signing, sources and javadoc jars, `install` alias, Central bundle): see docs/RELEASING.md
    ext.imPublicationDescription = 'InterMine Post Processes modules'
    apply from: "${rootDir}/../../config/gradle/publishing.gradle"

    // lifecycle: the tests need the (empty) test database, which has no file output to wire
    // (intermine.properties comes in through processResources)
    tasks.named('test') { dependsOn 'buildUnitTestDB' }
}

task testReport(type: TestReport) {
    destinationDirectory = layout.buildDirectory.dir('reports/allTests')
    // Include the results from the `test` task in all subprojects (flatMap keeps the task dependency)
    testResults.from(subprojects.collect { sub -> sub.tasks.named('test', Test).flatMap { it.binaryResultsDirectory } })
}

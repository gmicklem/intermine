sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

repositories {
    maven {
        url = project.getProperty("intermine.maven.central")
    }
}

dependencies {
    bioModel(libs.bio.model) { transitive = false }
    implementation libs.intermine.model
    implementation libs.intermine.objectstore
    implementation libs.intermine.api
    implementation libs.jena.core
    runtimeOnly libs.jena.arq // Model.write(out, "turtle") goes through the RIOT writers only with jena-arq present
}

processResources {
    from('.') { include ("*.properties")}
}

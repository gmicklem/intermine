sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

repositories {
    maven {
        url = project.getProperty("intermine.maven.central")
    }
}

dependencies {
    bioModel group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
    implementation group: "org.intermine", name: "intermine-model", version: imVersion
    implementation group: "org.intermine", name: "intermine-objectstore", version: imVersion
    implementation group: "org.intermine", name: "intermine-api", version: imVersion
    implementation libs.jena.core
    runtimeOnly libs.jena.arq // Model.write(out, "turtle") goes through the RIOT writers only with jena-arq present
}

processResources {
    from('.') { include ("*.properties")}
}

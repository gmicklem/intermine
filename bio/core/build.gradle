buildscript {
    repositories {
        ivy {
            // define in ~/.gradle/gradle.properties
            // intermine.plugin.repo=file:///your/intermine/repo/plugin/build/libs
            url project.getProperty("intermine.plugin.repo")
            patternLayout {
                artifact "[artifact]-[revision].[ext]"
            }
            metadataSources {
                artifact()
            }
        }

        maven {
            url project.getProperty("intermine.maven.central")
        }
    }
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

apply plugin: 'dbmodel'
apply plugin: 'biocore-dbmodel'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

configurations {
    // Jars that are not in a public Maven repository (obo, bbop, mockrunner, antlr-2.7.6-caching). They are on
    // the compile and runtime classpaths and are packed into this module's jar (see jar {} below).
    bundled
    implementation.extendsFrom bundled
    bioModel

    all {
        exclude group: 'org.apache.logging.log4j'
    }
}

dependencies {
    // api: types that appear in the public signatures of bio-core, or that the bio sources and mines
    // compile against through it (they use bio-core's compile classpath transitively).
    api group: "org.intermine", name: "intermine-api", version: System.getProperty("imVersion")
    api group: "org.intermine", name: "intermine-integrate", version: System.getProperty("imVersion")
    api group: "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
    api group: "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion") // idresolver needs db
    api group: "org.intermine", name: "intermine-pathquery", version: System.getProperty("imVersion")
    api group: 'org.apache.ant', name: 'ant', version: '1.7.0' // org.apache.tools.ant.Task is a superclass in the public API
    api group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.22'
    api group: 'commons-lang', name: 'commons-lang', version: '2.6'
    api group: 'commons-collections', name: 'commons-collections', version: '3.2'
    api group: 'commons-io', name: 'commons-io', version: '1.2'

    // never compiled against (no imports): the JDBC driver, the pool, the logging binding and bridge, and
    // the resources jar. Declared implementation, not runtimeOnly, so that the runtime scope stays in the
    // POM that the legacy maven plugin writes (it ignores runtimeOnly); runtimeOnly once publishing is maven-publish.
    implementation group: 'com.zaxxer', name: 'HikariCP', version: '4.0.3', transitive: false
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.14'
    implementation group: "org.intermine", name: "intermine-resources", version: System.getProperty("imVersion")
    implementation group: 'org.slf4j', name: 'slf4j-reload4j', version: '1.7.36'
    implementation group: 'commons-logging', name: 'commons-logging', version: '1.3.5'

    bundled fileTree(dir: 'libs', include: '*.jar') // obo and bbop not available in the public maven repo
    testImplementation group: "org.intermine", name: "intermine-integrate", version: System.getProperty("imVersion"), classifier: "testClasses"
    testImplementation group: "org.intermine", name: "bio-source-flymine-static", version: System.getProperty("flymineVersion"), transitive: false
    bioModel group: "org.intermine", name: "bio-source-flymine-static", version: System.getProperty("flymineVersion"), transitive: false
}

dbModelConfig {
    objectStoreName = "os.bio-test"
    modelName = "genomic"
    defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
}

task copyMineProperties(type: Copy) {
    from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
    into sourceSets.main.output.resourcesDir
    rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
}

// lifecycle: the unit tests need the (empty) test databases, which have no file output to wire
tasks.named('test') { dependsOn 'buildUnitTestDB' }
tasks.named('buildUnitTestDB') { dependsOn ':bio-testresources:createUnitTestDatabases' }

jar {
    // put all the JARs of the `bundled` configuration in the JAR
    from {
        configurations.bundled.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    // the entries of the bundled jars (META-INF, ...) may overlap: keep the first, as Gradle 6 did by default
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'genomic_model.xml'
}
